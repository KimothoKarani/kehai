spring:
  application:
    name: kehai-api

  datasource:
    url: jdbc:postgresql://localhost:5432/kehai
    username: kehai_user
    password: kehai_pass
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
    properties:
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.scheduler.instanceName: KehaiScheduler
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=300s

  security:
    oauth2:
      resourceserver:
        jwt:
          secret: ${JWT_SECRET:kehai-local-dev-secret-that-is-long-enough-32ch}

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

kehai:
  scoring:
    batch-size: 500
    risk-thresholds:
      high: 0.70
      medium: 0.40
    time-horizon-days: 30
  batch:
    nightly-scoring:
      # Quartz cron: sec min hour day-of-month month day-of-week
      # "Every day at 02:00:00"
      cron: "0 0 2 * * ?"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  info:
    title: Kehai API
    description: Behavioral churn prediction for B2B SaaS.
    version: 1.0.0
    contact:
      name: Kimotho Karani
